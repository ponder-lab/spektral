name: Tests and coverage

on: [push, pull_request]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.10, TensorFlow 2.9.3 and NumPy 1.23.5, as the corpus measures it, on Linux, with
        # scipy below 1.11 and networkx below 3 (below), where all of this code still runs.
        # TensorFlow 2.9.3 has no wheel for Python 3.11 or for macOS on arm64.
        python-version: ["3.10"]
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup utilities
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest coverage codecov
    - name: Install Spektral
      run: |
        python -m pip install "tensorflow==2.9.3" "numpy==1.23.5" "scipy<1.11" "networkx<3" .
    - name: Test with pytest and coverage
      run: |
        # test_qm7 and test_flickr download from hosts that no longer serve the files (deepchem's
        # qm7b.mat answers 400; Flickr's Google Drive file is not the archive), so they cannot pass.
        python -m coverage run --source=. -m pytest \
          --deselect tests/test_datasets.py::test_qm7 --deselect tests/test_datasets.py::test_flickr
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v1
